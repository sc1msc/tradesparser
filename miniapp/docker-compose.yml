# Сервер мини-аппа: api (FastAPI + фронтенд), bot (бот через релей) и caddy (HTTPS).
# Настройки - в miniapp/.env (шаблон: .env.example), в git не хранится.
services:
  api:
    build:
      context: ..
      dockerfile: miniapp/backend/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data          # база SQLite - переживает пересборку контейнера
    restart: unless-stopped

  bot:
    # Бот @honestlot_bot (app/bot.py): тот же образ, сам забирает сообщения из
    # Telegram через релей (HONESTLOT_TELEGRAM_API в .env, см. relay/setup.sh).
    build:
      context: ..
      dockerfile: miniapp/backend/Dockerfile
    command: ["python", "-m", "app.bot"]
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    env_file: .env            # DOMAIN - имя, на которое Caddy сам получит сертификат
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
