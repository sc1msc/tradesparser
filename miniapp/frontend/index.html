<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>HonestLot</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <!-- Официальный скрипт Telegram Mini App (initData, тема, кнопка "назад") - КОПИЯ на нашем
       сервере, а не https://telegram.org/js/telegram-web-app.js: из российских сетей telegram.org
       часто не открывается (проверено 01.10.2026), а скрипт стоит в head и блокирует страницу -
       у пользователей, чей встроенный браузер ходит в интернет без VPN, мини-апп висел на
       заглушке Telegram. Обновлять изредка: скачать файл с telegram.org заново (с ПК). -->
  <script src="telegram-web-app.js?v=2026-10-01"></script>
  <!-- ?v=... - меняйте при каждой выкладке, чтобы Telegram не держал старую версию в кэше. -->
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js?v=15"></script>
</body>
</html>
