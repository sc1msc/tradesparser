  <h1>Моя подписка</h1>
  <div id="login" class="card login hidden"></div>
  <div id="flash" class="flash hidden" role="status"></div>
  <div id="box" class="hidden"></div>
  <div id="error" class="err hidden"></div>
</main>

<dialog id="modal" class="modal" aria-labelledby="mTitle">
<div class="mbody">
  <button class="mclose" id="mClose" aria-label="Закрыть">&times;</button>
  <div class="micon" aria-hidden="true">!</div>
  <h2 id="mTitle">Отмена подписки</h2>
  <p class="hint">Автопродление отключится, способ оплаты будет отвязан от HonestLot. Больше списаний не будет.</p>
  <div class="mcard"><span class="hint">Способ оплаты</span><b id="mCard"></b></div>
  <div class="mnote">Доступ к Pro сохранится до конца оплаченного периода — <b id="mEnd"></b>.</div>
  <div class="mbtns">
    <button id="mConfirm" class="btn danger">Отменить подписку</button>
    <button id="mBack" class="btn ghost">Назад</button>
  </div>
  <div id="mError" class="err hidden"></div>
</div>
</dialog>

<script type="module">
// Страница «Моя подписка»: тариф, срок, способ оплаты, история платежей и отмена подписки.
// Отмена = отключить автопродление и отвязать карту: больше не списываем, идентификатор
// способа оплаты стираем, доступ - до конца оплаченного периода (billing.cancel). Экран сделан
// по образцу ЮKassa для подключения автоплатежей: пользователь сам отвязывает карту.
// Ссылка из письма (#link=...) открывает страницу без входа через Telegram.
import { api, showLogin, rub, date } from "./pay.js?v=4";
const $ = (id) => document.getElementById(id);

function el(tag, cls, ...kids) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
const shortDate = (iso) => new Intl.DateTimeFormat("ru-RU", { timeZone: "Europe/Moscow", day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(iso));
const forever = (iso) => new Date(iso).getFullYear() >= 2090;        // бессрочный подарок
const cardTitle = (t) => t.replace(/^Bank card/i, "Карта");
const row = (label, value) => el("div", "irow", el("span", "hint", label), el("b", null, value));

let sub = null;

async function load(flash) {
  $("login").classList.add("hidden");
  let s;
  try { s = await api("/status"); } catch (e) {
    if (e.status === 401) return showLogin($("login"), () => load());
    $("error").textContent = e.status === 404 ? "Страница пока недоступна." : e.message;
    return $("error").classList.remove("hidden");
  }
  if (flash) { $("flash").textContent = flash; $("flash").classList.remove("hidden"); }
  sub = s.subscription;
  const box = $("box");
  box.classList.remove("hidden");
  if (!sub) {
    box.replaceChildren(el("section", "card", el("p", null, "Подписки нет."),
      Object.assign(el("a", "btn", "Оформить HonestLot Pro"), { href: "./" + location.hash })));
    return;
  }
  const gift = sub.price === 0;
  const card = sub.autorenew && sub.payment_method ? cardTitle(sub.payment_method) : null;

  // статус справа
  let badge;
  if (sub.status === "past_due") badge = el("div", "badge warn", el("span", null, "Продление не прошло"), el("b", null, "повторим завтра"));
  else if (!s.pro) badge = el("div", "badge off", el("span", null, "Закончилась"), el("b", null, shortDate(sub.period_end)));
  else if (forever(sub.period_end)) badge = el("div", "badge ok", el("span", null, "Активна"), el("b", null, "бессрочно"));
  else badge = el("div", "badge ok", el("span", null, "Активна до"), el("b", null, shortDate(sub.period_end)));

  const icon = Object.assign(el("img", "subicon"), { src: "/logo.svg", alt: "" });
  const head = el("div", "subhead", icon,
    el("div", "subt", el("b", null, "HonestLot Pro"), el("span", "hint", gift ? (forever(sub.period_end) ? "подарок" : `${sub.plan_title} · подарок`) : `${sub.plan_title} · ${rub(sub.price)}`)),
    badge);

  const actions = el("div", "actions");
  if (sub.autorenew) {
    const b = el("button", "btn outline-danger", "Отменить подписку");
    b.id = "cancel";
    b.onclick = openModal;
    actions.append(b);
  } else if (!gift || !s.pro) {
    actions.append(Object.assign(el("a", "btn", s.pro ? "Оплатить следующий период" : "Оформить снова"), { href: "./" + location.hash }));
  }
  const top = el("section", "card", head);

  const next = sub.autorenew ? `${shortDate(sub.period_end)}, ${rub(sub.price)}`
    : gift ? "не будет — подарок" : "не будет — автопродление выключено";
  const info = el("section", "card",
    el("h2", null, "Информация о подписке"),
    el("div", "irows",
      row("Дата оформления", shortDate(sub.created_at)),
      row("Следующее списание", next),
      row("Способ оплаты", card || (gift ? "не нужен" : "отвязан")),
      row("Письма о подписке", sub.email || "—")));

  const pays = s.payments || [];
  const hist = el("section", "card", el("h2", null, "История платежей"));
  if (!pays.length) hist.append(el("p", "hint", "Платежей пока нет."));
  else {
    const t = el("table", "hist");
    t.append(el("thead", null, el("tr", null, el("th", null, "Дата"), el("th", "r", "Сумма"), el("th", "r", "Статус"))));
    const tb = el("tbody");
    for (const p of pays) tb.append(el("tr", null,
      el("td", null, shortDate(p.date), el("span", "hint sm", p.renewal ? " продление" : "")),
      el("td", "r", rub(p.amount)),
      el("td", "r", el("span", p.ok ? "pill ok" : "pill bad", p.ok ? "оплачено" : "не прошёл"))));
    t.append(tb);
    hist.append(t);
  }
  box.replaceChildren(top, info, ...(actions.childElementCount ? [actions] : []), hist);
}

function openModal() {
  $("mCard").textContent = cardTitle(sub.payment_method || "сохранённый способ оплаты");
  $("mEnd").textContent = date(sub.period_end);
  $("mError").classList.add("hidden");
  $("mConfirm").disabled = false;
  $("modal").showModal();
  $("mBack").focus();
}
const closeModal = () => $("modal").close();
$("mClose").onclick = closeModal;
$("mBack").onclick = closeModal;
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });  // клик по фону
$("mConfirm").onclick = async () => {
  $("mConfirm").disabled = true;
  try {
    await api("/cancel", { method: "POST" });
    closeModal();
    load("Подписка отменена, способ оплаты отвязан. Списаний больше не будет.");
  } catch (e) {
    $("mError").textContent = e.message;
    $("mError").classList.remove("hidden");
    $("mConfirm").disabled = false;
  }
};
load();
</script>
</body>
</html>
