<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HonestLot Pro - оплата</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="pay.css?v=3">
</head>
<body>
<main>
  <div class="brand"><img src="/logo.svg" alt=""><b>Honest<span>Lot</span></b></div>
  <div class="card" id="box">Проверяем оплату…</div>
</main>
<script type="module">
// Сюда платёжный сервис возвращает после оплаты (return_url, см. billing.checkout):
// ждём, пока платёж станет оплачен или отменён (уведомление провайдера или опрос).
import { api, rub, date } from "./pay.js?v=4";
const box = document.getElementById("box");
const order = new URLSearchParams(location.search).get("order");
let tries = 0;
async function poll() {
  let r;
  try { r = await api(`/order/${encodeURIComponent(order || "")}`); } catch (e) { box.textContent = "Не нашли платёж. Если деньги списались - напишите в поддержку."; return; }
  if (r.status === "succeeded") {
    box.innerHTML = `<h1 class="ok">Оплата прошла</h1><p>${rub(r.amount)} за HonestLot Pro (${r.plan_title}).` +
      (r.period_end ? ` Pro действует до ${date(r.period_end)}.` : "") +
      `</p><p class="hint">Письмо с подтверждением и ссылкой на управление подпиской придёт на ваш e-mail. Можно вернуться в Telegram.</p>`;
  } else if (r.status === "canceled") {
    box.innerHTML = `<h1>Оплата не прошла</h1><p>Деньги не списаны.</p><p><a href="./">Попробовать ещё раз</a></p>`;
  } else if (++tries < 40) {
    setTimeout(poll, 3000);
  } else {
    box.innerHTML = `<p>Платёж ещё обрабатывается. Когда он пройдёт, придёт письмо на ваш e-mail.</p>`;
  }
}
poll();
</script>
</body>
</html>
